services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-config:/config
      - caddy-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --credentials-file
      - /etc/cloudflared/${CLOUDFLARED_CREDENTIALS_FILENAME}
      - ${CLOUDFLARED_TUNNEL_ID}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/${CLOUDFLARED_CREDENTIALS_FILENAME}:/etc/cloudflared/${CLOUDFLARED_CREDENTIALS_FILENAME}:ro
    depends_on:
      - caddy

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "13378:80"
    volumes:
      - ${AUDIOBOOKS_PATH}:/audiobooks:ro
      - abs-config:/config
      - abs-metadata:/metadata

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ${BOOKS_PATH}:/books
      - calibre-web-config:/config

  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    ports:
      - "25600:25600"
    environment:
      - SERVER_PORT=25600
      - KOMGA_LIBRARIES_SCAN_DIRECTORY_EXCLUSIONS=@supplements
    volumes:
      - ${COMICS_PATH}:/comics:ro
      - ${MAGAZINES_PATH}:/magazines:ro
      - komga-config:/config

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=0
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
    volumes:
      - ${MAIN_MUSIC_PATH}:/music:ro
      - ${VIDEO_GAME_MUSIC_PATH}:/library/games:ro
      - navidrome-data:/data

volumes:
  caddy-config:
    external: true
  caddy-data:
    external: true
  abs-config:
    external: true
  abs-metadata:
    external: true
  calibre-web-config:
    external: true
  komga-config:
    external: true
  navidrome-data:
    external: true